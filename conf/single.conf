pos1-posmode       =single     # (0:single,1:dgps,2:kinematic)
pos1-elmask        =7          # (deg)
pos2-elmin-dopp    =7          # (deg)
pos1-dynamics      =on         # (0:off,1:on)
pos1-ionoopt       =brdc       # (0:off,1:brdc,2:sbas,3:dual-freq,4:est-stec,5:ionex-tec,6:qzs-brdc,7:qzs-lex,8:stec)
pos1-tropopt       =saas       # (0:off,1:saas,2:sbas,3:est-ztd,4:est-ztdgrad,5:ztd)
pos1-sateph        =brdc       # (0:brdc,1:precise,2:brdc+sbas,3:brdc+ssrapc,4:brdc+ssrcom)
pos1-navsys        =63         # (1:gps+2:sbas+4:glo+8:gal+16:qzs+32:comp)
pos1-min-cn0-code  =7.0        # CN0 mask (dBHz) for pseudorange measurement
pos1-min-cn0-dopp  =7.0        # CN0 mask (dBHz) for doppler measurement

pos2-rejgdop       =30.0       # reject threshold of gdop
pos2-sptype        =

out-solformat      =llh        # (0:llh,1:xyz,2:enu,3:nmea)
out-timesys        =gpst       # (0:gpst,1:utc,2:jst)
out-timeform       =hms        # (0:tow,1:hms)
out-timendec       =3
out-degform        =deg        # (0:deg,1:dms)
out-height         =geodetic   # (0:ellipsoidal,1:geodetic)

stats-clkstab      =5e-10      # (s/s)
stats-aepsd        =3.0
stats-anpsd        =3.0
stats-avpsd        =0.1
stats-clkfpsd      =0.5
stats-clkppsd      =5.0

file-dcbfile       =
file-gpsnavf       =
file-bdsnavf       =
file-glonavf       =
file-baseobsf      =

